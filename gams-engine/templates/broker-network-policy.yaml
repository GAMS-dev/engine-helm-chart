{{ if .Values.global.useNetworkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gams-engine.prefixname" . }}-broker-np
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "gams-engine.prefixname" . }}-broker
  policyTypes:
    - Egress
    - Ingress
  ingress:
    {{- if .Values.broker.networkPolicy.ingress }}
    # Ingress rules
    {{- include "common.tplvalues.render" (dict "value" .Values.broker.networkPolicy.ingress "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.broker.networkPolicy.extraIngress }}
    # Optional extra ingress rules
    {{- include "common.tplvalues.render" (dict "value" .Values.broker.networkPolicy.extraIngress "context" $) | nindent 4 }}
    {{- end }}
  egress:
    - to:
      - podSelector:
          matchLabels:
            app: {{ include "gams-engine.prefixname" . }}-fwd-prxy
      ports:
        - protocol: TCP
          port: 8000
    - to:
      - podSelector:
          matchLabels:
            app: {{ include "gams-engine.prefixname" . }}-queue
      ports:
        - protocol: TCP
          port: 5672
    - to:
      - podSelector:
          matchLabels:
            app: {{ include "gams-engine.prefixname" . }}-pgbouncer
      ports:
        - protocol: TCP
          port: 6432
{{- if .Values.mongodb.externalDatabase.enabled }}
    - to:
      - podSelector:
{{ toYaml .Values.mongodb.externalDatabase.networkPolicy.podSelector | indent 10 }}
        namespaceSelector:
{{ toYaml .Values.mongodb.externalDatabase.networkPolicy.namespaceSelector | indent 10 }}
      ports:
        - protocol: TCP
          port: {{ .Values.mongodb.externalDatabase.port }}
{{- else }}
    - to:
      - podSelector:
          matchLabels:
            app: {{ include "gams-engine.prefixname" . }}-mongo
      ports:
        - protocol: TCP
          port: 27017
{{- end }}
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.broker.networkPolicy.extraEgress }}
    # Optional extra egress rules
    {{- include "common.tplvalues.render" (dict "value" .Values.broker.networkPolicy.extraEgress "context" $) | nindent 4 }}
    {{- end }}
{{ end }}
