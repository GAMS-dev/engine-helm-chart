apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gams-engine.prefixname" . }}-queue-def
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
data:
  definitions.json: |-
{{ (tpl (.Files.Get "resources/rabbitmq/definitions.json") .) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gams-engine.prefixname" . }}-queue-adv-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
data:
  advanced.config: |-
{{- if .Values.rabbitmq.advancedConfig }}
{{ .Values.rabbitmq.advancedConfig | indent 4 }}
{{- else }}
{{ (tpl (.Files.Get "resources/rabbitmq/advanced.config") .) | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gams-engine.prefixname" . }}-queue-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
data:
  rabbitmq.conf: |-
{{- if .Values.rabbitmq.rabbitmqConf }}
{{ .Values.rabbitmq.rabbitmqConf | indent 4 }}
{{- else }}
{{ (tpl (.Files.Get "resources/rabbitmq/rabbitmq.conf") .) | indent 4 }}
{{- end }}
