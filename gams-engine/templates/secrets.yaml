{{- /* Fail fast on deprecated values keys. */ -}}
{{- if hasKey .Values.postgresql "database_user" }}
  {{- fail "DEPRECATED: postgresql.database_user has been renamed to postgresql.databaseUser. Please update your values.yaml." }}
{{- end }}

{{- $secretName := printf "%s-secret" (include "gams-engine.prefixname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $brokerPassword := randAlphaNum 32 -}}

{{- $mongoBrokerPwd  := randAlphaNum 32 }}
{{- $mongoWorkerPwd  := randAlphaNum 32 }}
{{- $mongoSteinPwd   := randAlphaNum 32 }}
{{- $mongoJackPwd    := randAlphaNum 32 }}
{{- $mongoSpawnerPwd := randAlphaNum 32 }}
{{- $mongoCancelPwd  := randAlphaNum 32 }}
{{- $mongoDepPwd     := randAlphaNum 32 }}
{{- $mongoEventPwd   := randAlphaNum 32 }}
{{- $mongoProxyPwd   := randAlphaNum 32 }}
{{- $mongoWatcherPwd := randAlphaNum 32 }}

{{- if $existingSecret }}
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_BROKER_PWD" }}{{ $mongoBrokerPwd = index $existingSecret.data "GMS_RUNNER_MONGO_BROKER_PWD" | b64dec }}{{ end }}     # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_WORKER_PWD" }}{{ $mongoWorkerPwd = index $existingSecret.data "GMS_RUNNER_MONGO_WORKER_PWD" | b64dec }}{{ end }}     # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_HYPERCUBE_APPENDER_PWD" }}{{ $mongoSteinPwd = index $existingSecret.data "GMS_RUNNER_MONGO_HYPERCUBE_APPENDER_PWD" | b64dec }}{{ end }}  #pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_CLEANER_PWD" }}{{ $mongoJackPwd = index $existingSecret.data "GMS_RUNNER_MONGO_CLEANER_PWD" | b64dec }}{{ end }}    # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_SPWN_PWD" }}{{ $mongoSpawnerPwd = index $existingSecret.data "GMS_RUNNER_MONGO_SPWN_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_K8S_CANCEL_PWD" }}{{ $mongoCancelPwd = index $existingSecret.data "GMS_RUNNER_MONGO_K8S_CANCEL_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_DEPENDENCY_CHECK_PWD" }}{{ $mongoDepPwd = index $existingSecret.data "GMS_RUNNER_MONGO_DEPENDENCY_CHECK_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_EVENT_MANAGER_PWD" }}{{ $mongoEventPwd = index $existingSecret.data "GMS_RUNNER_MONGO_EVENT_MANAGER_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_FORWARD_PROXY_PWD" }}{{ $mongoProxyPwd = index $existingSecret.data "GMS_RUNNER_MONGO_FORWARD_PROXY_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
  {{- if hasKey $existingSecret.data "GMS_RUNNER_MONGO_K8S_JOB_WATCHER_PWD" }}{{ $mongoWatcherPwd = index $existingSecret.data "GMS_RUNNER_MONGO_K8S_JOB_WATCHER_PWD" | b64dec }}{{ end }}   # pragma: allowlist secret
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  GMS_RUNNER_DATABASE_ADMIN_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_ADMIN_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
{{- if .Values.postgresql.externalDatabase.enabled }}
  GMS_RUNNER_DATABASE_ADMIN_URI: {{ include "gams-engine.postgres.connectionString" . | quote }}
{{- end }}
  GMS_RUNNER_DATABASE_BROKER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_BROKER_PWD") | b64dec }}{{ else }}{{ $brokerPassword }}{{ end }}
  GMS_RUNNER_DATABASE_WORKER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_WORKER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_CLEANER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_CLEANER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_SPWN_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_SPWN_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_K8S_CANCEL_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_K8S_CANCEL_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_DEPENDENCY_CHECK_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_DEPENDENCY_CHECK_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_EVENT_MANAGER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_EVENT_MANAGER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_DATABASE_K8S_JOB_WATCHER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_DATABASE_K8S_JOB_WATCHER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_PGBOUNCER_USERLIST: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_PGBOUNCER_USERLIST") | b64dec | quote }}{{ else }}{{ printf "'\"broker\" \"%s\"'" $brokerPassword }}{{ end }}
  GMS_RUNNER_FORWARD_PROXY_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_FORWARD_PROXY_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_FORWARD_PROXY_SECRET: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_FORWARD_PROXY_SECRET") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_FORWARD_PROXY_ENC_KEY: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_FORWARD_PROXY_ENC_KEY") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_BROKER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_BROKER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_WORKER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_WORKER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_HYPERCUBE_APPENDER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_HYPERCUBE_APPENDER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_CLEANER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_CLEANER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_HYPERCUBE_UNPACKER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_HYPERCUBE_UNPACKER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_MIGRATE_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_MIGRATE_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_SPWN_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_SPWN_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_K8S_CANCEL_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_K8S_CANCEL_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_DEPENDENCY_CHECK_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_DEPENDENCY_CHECK_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_EVENT_MANAGER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_EVENT_MANAGER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  GMS_RUNNER_RABBIT_K8S_JOB_WATCHER_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "GMS_RUNNER_RABBIT_K8S_JOB_WATCHER_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  {{- if .Values.broker.monitoring.metricsEnabled }}
  PROMETHEUS_AUTH_USERNAME: "metrics"
  PROMETHEUS_AUTH_PASSWORD: {{ if $existingSecret }}{{ (index $existingSecret.data "PROMETHEUS_AUTH_PASSWORD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  {{- end}}

  GMS_RUNNER_MONGO_BROKER_PWD: {{ $mongoBrokerPwd | quote }}
  GMS_RUNNER_MONGO_WORKER_PWD: {{ $mongoWorkerPwd | quote }}
  GMS_RUNNER_MONGO_HYPERCUBE_APPENDER_PWD: {{ $mongoSteinPwd | quote }}
  GMS_RUNNER_MONGO_CLEANER_PWD: {{ $mongoJackPwd | quote }}
  GMS_RUNNER_MONGO_SPWN_PWD: {{ $mongoSpawnerPwd | quote }}
  GMS_RUNNER_MONGO_K8S_CANCEL_PWD: {{ $mongoCancelPwd | quote }}
  GMS_RUNNER_MONGO_DEPENDENCY_CHECK_PWD: {{ $mongoDepPwd | quote }}
  GMS_RUNNER_MONGO_EVENT_MANAGER_PWD: {{ $mongoEventPwd | quote }}
  GMS_RUNNER_MONGO_FORWARD_PROXY_PWD: {{ $mongoProxyPwd | quote }}
  GMS_RUNNER_MONGO_K8S_JOB_WATCHER_PWD: {{ $mongoWatcherPwd | quote }}

{{- if .Values.mongodb.externalDatabase.enabled }}
    {{- $cs := include "gams-engine.mongo.connectionString" . }}
    {{- /* Per-service URIs reuse the admin URI's host and options, except authSource/uuidRepresentation. */ -}}
    {{- $mongoProtocol := regexFind "^[^:]+" $cs }}
    {{- $mongoHost := include "gams-engine.uri.hosts" $cs }}
    {{- $mongoDbName := include "gams-engine.mongo.databaseName" $ }}
    {{- $adminOptions := "" }}
    {{- if contains "?" $cs }}
      {{- $adminOptions = regexFind "\\?.*$" $cs | trimPrefix "?" }}
    {{- end }}
    {{- $serviceOptions := list }}
    {{- range $pair := splitList "&" $adminOptions }}
      {{- if and (ne $pair "") (not (regexFind "^(authSource|uuidRepresentation)=" $pair)) }}
        {{- $serviceOptions = append $serviceOptions $pair }}
      {{- end }}
    {{- end }}
    {{- $mongoOptions := "" }}
    {{- $svcOpts := join "&" $serviceOptions }}
    {{- if $svcOpts }}
      {{- $mongoOptions = printf "?%s&uuidRepresentation=pythonLegacy" $svcOpts }}
    {{- else }}
      {{- $mongoOptions = "?uuidRepresentation=pythonLegacy" }}
    {{- end }}

    # Admin Connection String for Init Job or Migrations

  GMS_RUNNER_MONGO_ADMIN_URI: {{ $cs | quote }}

  # MongoDB connection strings for components
  GMS_RUNNER_MONGO_BROKER_URI: "{{ $mongoProtocol }}://mongo_broker:{{ $mongoBrokerPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_WORKER_URI: "{{ $mongoProtocol }}://mongo_worker:{{ $mongoWorkerPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_HYPERCUBE_URI: "{{ $mongoProtocol }}://stein:{{ $mongoSteinPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_CLEANER_URI: "{{ $mongoProtocol }}://jack:{{ $mongoJackPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_SPAWNER_URI: "{{ $mongoProtocol }}://job_spawner:{{ $mongoSpawnerPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_CANCEL_URI: "{{ $mongoProtocol }}://k8s_job_canceler:{{ $mongoCancelPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_DEPENDENCY_URI: "{{ $mongoProtocol }}://dep_check:{{ $mongoDepPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_EVENT_URI: "{{ $mongoProtocol }}://event_manager:{{ $mongoEventPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_PROXY_URI: "{{ $mongoProtocol }}://forward_proxy:{{ $mongoProxyPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  GMS_RUNNER_MONGO_WATCHER_URI: "{{ $mongoProtocol }}://k8s_job_watcher:{{ $mongoWatcherPwd }}@{{ $mongoHost }}/{{ $mongoDbName }}{{ $mongoOptions }}"
  {{- end }}
