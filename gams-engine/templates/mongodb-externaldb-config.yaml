{{- if .Values.mongodb.externalDatabase.enabled }}
{{- if .Values.mongodb.externalDatabase.initialize.run }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gams-engine.prefixname" . }}-mongo-external-init-cm
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
data:
  setup.sh: |-
{{ .Files.Get "resources/mongo/external-db-setup.sh" | indent 4 }}

{{- end }}
{{- end }}
