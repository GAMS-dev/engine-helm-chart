{{ if .Values.gamsLicenseServer.enabled }}

{{- $secretName := "license-server-secret" -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  LICENSE_SERVER_DB_PWD: {{ if $existingSecret }}{{ (index $existingSecret.data "LICENSE_SERVER_DB_PWD") | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}

{{ end }}
