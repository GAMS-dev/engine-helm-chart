{{- if or .Values.mongodb.externalDatabase.enabled .Values.postgresql.externalDatabase.enabled }}
{{- /* Admin URIs for pre-upgrade migrations; the main Secret is not updated yet. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gams-engine.prefixname" . }}-migrate-secret
  labels:
    {{- include "gams-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- if .Values.mongodb.externalDatabase.enabled }}
  MONGODB_URI: {{ include "gams-engine.mongo.connectionString" . | quote }}
  {{- end }}
  {{- if .Values.postgresql.externalDatabase.enabled }}
  POSTGRES_CONNECTION_STRING: {{ include "gams-engine.postgres.connectionString" . | quote }}
  {{- end }}
{{- end }}
